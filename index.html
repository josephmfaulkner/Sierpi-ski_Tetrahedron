<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sierpiński Tetrahedron</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05060a;
        height: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #panel {
        position: fixed;
        left: 0px;
        top: 14px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font: 12px/1.4 'SFMono-Regular', Consolas, Menlo, monospace;
        color: rgba(255, 255, 255, 0.75);
        background: rgba(0, 0, 0, 0.4);
        padding: 12px 14px;
        border-radius: 8px;
        user-select: none;
      }
      #panel .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #panel label {
        min-width: 70px;
      }
      #panel input[type='range'] {
        width: 100%;
      }
      #info {
        opacity: 0.6;
      }
      #hint {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <div class="row">
        <label for="depth">Detail</label>
        <input id="depth" type="range" min="0" max="10" step="1" value="4" />
        <span id="depth-value">4</span>
      </div>
      <div class="row">
        <label for="color">Color</label>
        <input id="color" type="color" />
      </div>
      <div class="row">
        <label for="bg-top">Sky</label>
        <input id="bg-top" type="color" />
      </div>
      <div class="row">
        <label for="bg-bottom">Ground</label>
        <input id="bg-bottom" type="color" />
      </div>
      <div id="info">initializing…</div>
      <div id="hint">drag to rotate · scroll to zoom</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
